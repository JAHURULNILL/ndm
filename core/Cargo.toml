[package]
name = "ndm-core"
version = "2.1.0"
edition = "2021"
description = "NDM core — app state, journal, scheduler, updater latch and command bodies extracted from the Tauri shell (Phase 1 of the native programme); UI-free, events leave through the EventSink seam"
license = "MIT OR Apache-2.0"
authors = ["Nill"]

# Detached from the root workspace (the root package's own crate
# layout), the same way src-tauri is kept out of it: this crate is
# depended on by path from the shells, never built as part of the
# engine package.
[workspace]

[dependencies]
ndm = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = { version = "3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
