[package]
name = "ndm"
version = "1.8.0"
edition = "2021"
description = "NDM download engine — dynamic segmentation, resume, site grabber (Linux + Windows target)"
license = "MIT OR Apache-2.0"
authors = ["Nill"]
default-run = "ndm"

[[bin]]
name = "ndm"
path = "src/main.rs"

[[bin]]
name = "ndm-host"
path = "src/bin/ndm-host.rs"

[workspace]
exclude = ["src-tauri"]

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "charset", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
