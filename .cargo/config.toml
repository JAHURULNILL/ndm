# Windows: statically link the MSVC C runtime into our binaries.
#
# Without this, Rust's x86_64-pc-windows-msvc target links the
# Universal CRT dynamically: the exe imports ucrtbase.dll /
# api-ms-win-crt-*.dll, which ship in-box only on Windows 10+.
# On Windows 8/8.1 (and unpatched Windows 7) the loader aborts
# before main() with "api-ms-win-crt-math-l1-1-0.dll is missing"
# unless the user has installed the VC++ Redistributable — our
# installer does not install it, so the app simply never starts.
# +crt-static bakes the CRT into ndm-app.exe / ndm-host.exe /
# ndm.exe themselves; the exes grow by a few hundred KB and gain
# no external runtime dependency.
#
# Target-scoped only: host builds (build scripts, proc macros)
# and all non-Windows targets are completely unaffected.
#
# Six api-ms-win-crt-* forwarders (math/heap/locale/runtime/
# stdio/string) still survive in ndm-app.exe: they come out of
# Microsoft's static UCRT itself — libucrt.lib ships a subset of
# its functions (locale is the textbook case) only as thunks to
# the shared DLLs, so any binary that references them imports
# the forwarders even under +crt-static. Excluding the umbrella
# lib instead (/NODEFAULTLIB:ucrt.lib, tried in CI run #39)
# fails the link outright. The fix is app-local deployment: CI
# ships the SDK's UCRT redist set (ucrtbase.dll + the
# api-ms-win-* stubs) beside the exes, so Windows 7/8 resolve
# the forwarders from the app's own folder.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Same static-CRT rule for the 32-bit MSVC target (2.2.0 x86
# build): without it the x86 exes import the dynamic UCRT and
# fail to start on Windows 7/8 exactly as the x64 ones did.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
