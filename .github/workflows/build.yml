# NDM release builds.
#
# Linux:   the .deb (Debian/Ubuntu family) and the portable tarball
#          (any distro) — the same packaging scripts used locally.
#          Since 2.1.0 the app is the native GTK shell
#          (shell-gtk crate); there is no WebKit dependency.
# Windows: a portable ZIP (ndm-app.exe + ndm-host.exe + extension)
#          AND a per-user NSIS installer
#          (NDM_<ver>_x64-setup.exe, built from scripts/installer.nsi
#          over the same assembled tree, silent-install tested in
#          the job). Since 2.1.0 ndm-app.exe is the native Win32
#          shell (shell-win crate) — no WebView2 runtime is needed
#          on any supported Windows (7/8/8.1/10/11).
#
# Runs on version tags (v*) and on manual dispatch.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ffmpeg zip
      - name: Fetch bundled tools (yt-dlp, deno)
        run: bash scripts/fetch-tools.sh
      - name: Fetch portable ffmpeg (BtbN build — the distro static
          builds segfault on merges, this one is merge-verified)
        run: |
          curl -sL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg tools/ffmpeg
          chmod +x tools/ffmpeg
      - name: Build
        run: |
          cargo build --release
          cargo build --release --manifest-path core/Cargo.toml
          cargo build --release --manifest-path shell-gtk/Cargo.toml
      - name: Test lib on Linux
        run: cargo test --release
      - name: Test core on Linux
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Package (.deb + portable tarball)
        run: |
          bash scripts/package-deb.sh
          bash scripts/package-portable.sh
      - name: Extension version matches app version
        run: python3 -c "import json,re,sys; e=json.load(open('extension/manifest.json'))['version']; t=re.search(r'^version = \"(.*)\"', open('Cargo.toml').read(), re.M).group(1); print(f'extension {e} vs app {t}'); sys.exit(0 if e == t else 'extension/manifest.json version != Cargo.toml version')"
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-linux
          path: |
            NDM_*_amd64.deb
            NDM_*_Linux_Portable.tar.xz
            ndm-extension-*.zip
      - name: Build extension ZIP (for the release upload)
        if: github.event_name == 'workflow_dispatch'
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          cd extension && zip -q ../ndm-extension-$v.zip manifest.json background.js content.js page-hook.js popup.html popup.js icon16.png icon48.png icon128.png com.ndm.host.chrome.json.tmpl com.ndm.host.firefox.json.tmpl install-host.sh README.md && cd ..
          ls -la ndm-extension-$v.zip
      - name: Attach Linux assets to their GitHub release (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          gh release upload "v$v" NDM_*_amd64.deb NDM_*_Linux_Portable.tar.xz ndm-extension-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No engine staging step: the video engine (yt-dlp, deno,
      # ffmpeg) is NOT packaged — the app fetches it once, silently
      # in the background on first launch, hash-verified against
      # pins in src/components.rs, exactly as on Linux. That is
      # what keeps both Windows packages IDM-sized.
      - name: Build
        run: |
          cargo build --release
          cargo build --release --manifest-path core/Cargo.toml
          cargo build --release --manifest-path shell-win/Cargo.toml
      # Two separate steps on purpose: in one shared pwsh block the
      # block's exit code is the LAST command's, so a failing lib
      # suite was masked by the passing app suite (build #14 shipped
      # green with a red lib test). Each suite must fail its own step.
      - name: Test lib on Windows
        run: cargo test --release
      - name: Test core on Windows
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "NDM-Windows-Portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # The native shell ships AS ndm-app.exe (same installed
          # name as always — the self-update relaunch, shortcuts
          # and the uninstall list all key off it).
          Copy-Item shell-win/target/release/ndm-shell-win.exe $dir/ndm-app.exe
          Copy-Item target/release/ndm-host.exe $dir/
          # App-local Universal CRT (see .cargo/config.toml):
          # the SDK redist set ships beside the exes so Windows
          # 7/8 resolve ndm-app.exe's remaining api-ms-win-crt-*
          # forwarders app-locally. The installer packages this
          # same folder (SRCROOT), so one copy covers both.
          $ucrtBase = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Filter ucrtbase.dll -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match 'x64' } | Select-Object -First 1
          if (-not $ucrtBase) { throw "UCRT redist set (x64) not found on this runner" }
          Copy-Item (Join-Path $ucrtBase.DirectoryName "*.dll") $dir/
          Copy-Item extension $dir/extension -Recurse
          Compress-Archive $dir "NDM_${v}_Windows_Portable.zip"
      # Win7/8 API discipline as a hard gate (NATIVE-PLAN.md
      # risk #4): the shipped exe must not import any function
      # newer than Windows 8.0, and its subsystem must stay <= 6.1.
      - name: PE import audit (Win7/8 API discipline)
        shell: pwsh
        run: |
          python scripts/pe-import-audit.py NDM-Windows-Portable\ndm-app.exe
          if ($LASTEXITCODE -ne 0) { throw "PE import audit failed" }
      - name: Smoke — host handshake (gate) + app launch (report)
        shell: pwsh
        run: |
          $dir = "NDM-Windows-Portable"
          $msg = [System.Text.Encoding]::UTF8.GetBytes('{"type":"ping"}')
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "$dir/ndm-host.exe").Path
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $hp = [System.Diagnostics.Process]::Start($psi)
          $len = [BitConverter]::GetBytes([int]$msg.Length)
          $hp.StandardInput.BaseStream.Write($len, 0, 4)
          $hp.StandardInput.BaseStream.Write($msg, 0, $msg.Length)
          $hp.StandardInput.BaseStream.Flush()
          $hp.StandardInput.Close()
          $buf = New-Object byte[] 4
          $hp.StandardOutput.BaseStream.Read($buf, 0, 4) | Out-Null
          $n = [BitConverter]::ToInt32($buf, 0)
          $body = New-Object byte[] $n
          $off = 0
          while ($off -lt $n) { $r = $hp.StandardOutput.BaseStream.Read($body, $off, $n - $off); if ($r -le 0) { break }; $off += $r }
          $reply = [System.Text.Encoding]::UTF8.GetString($body)
          Write-Host "host reply: $reply"
          if ($reply -notmatch '"pong"\s*:\s*true') { throw "host handshake failed" }
          $hp.WaitForExit(5000) | Out-Null
          $app = Start-Process (Resolve-Path "$dir/ndm-app.exe").Path -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { Write-Warning "ndm-app.exe exited early, code $($app.ExitCode)" } else { Write-Host "ndm-app.exe alive after 10s"; Stop-Process -Id $app.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-windows
          path: |
            NDM_*_Windows_Portable.zip
      - name: Attach Windows assets to their GitHub release (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $zip = (Get-ChildItem "NDM_${v}_Windows_Portable.zip").Name
          gh release upload "v$v" $zip --clobber --repo $env:GITHUB_REPOSITORY
  windows-i686:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      # No engine staging step: the video engine (yt-dlp, deno,
      # ffmpeg) is NOT packaged — the app fetches it once, silently
      # in the background on first launch, hash-verified against
      # pins in src/components.rs, exactly as on Linux. That is
      # what keeps both Windows packages IDM-sized.
      - name: Build (i686 MSVC)
        run: |
          cargo build --release --target i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc --manifest-path core/Cargo.toml
          cargo build --release --target i686-pc-windows-msvc --manifest-path shell-win/Cargo.toml
      # Two separate steps on purpose: in one shared pwsh block the
      # block's exit code is the LAST command's, so a failing lib
      # suite was masked by the passing app suite (build #14 shipped
      # green with a red lib test). Each suite must fail its own step.
      - name: Test lib on Windows (i686)
        run: cargo test --release --target i686-pc-windows-msvc
      - name: Test core on Windows (i686)
        run: cargo test --release --target i686-pc-windows-msvc --manifest-path core/Cargo.toml
      - name: Assemble portable ZIP (x86)
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "NDM-Windows-Portable-x86"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # The native shell ships AS ndm-app.exe (same installed
          # name as always — the self-update relaunch, shortcuts
          # and the uninstall list all key off it).
          Copy-Item shell-win/target/i686-pc-windows-msvc/release/ndm-shell-win.exe $dir/ndm-app.exe
          Copy-Item target/i686-pc-windows-msvc/release/ndm-host.exe $dir/
          # App-local Universal CRT (see .cargo/config.toml):
          # the SDK redist set ships beside the exes so Windows
          # 7/8 resolve ndm-app.exe's remaining api-ms-win-crt-*
          # forwarders app-locally. The installer packages this
          # same folder (SRCROOT), so one copy covers both.
          $ucrtBase = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Filter ucrtbase.dll -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'x86' } | Select-Object -First 1
          if (-not $ucrtBase) { throw "UCRT redist set (x86) not found on this runner" }
          Copy-Item (Join-Path $ucrtBase.DirectoryName "*.dll") $dir/
          Copy-Item extension $dir/extension -Recurse
          Compress-Archive $dir "NDM_${v}_Windows_Portable_x86.zip"
      # Win7/8 API discipline as a hard gate (NATIVE-PLAN.md
      # risk #4): the shipped exe must not import any function
      # newer than Windows 8.0, and its subsystem must stay <= 6.1.
      - name: PE import audit (Win7/8 API discipline, x86)
        shell: pwsh
        run: |
          python scripts/pe-import-audit.py NDM-Windows-Portable-x86\ndm-app.exe
          if ($LASTEXITCODE -ne 0) { throw "PE import audit failed" }
      - name: Smoke — host handshake (gate) + app launch (report)
        shell: pwsh
        run: |
          $dir = "NDM-Windows-Portable-x86"
          $msg = [System.Text.Encoding]::UTF8.GetBytes('{"type":"ping"}')
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "$dir/ndm-host.exe").Path
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $hp = [System.Diagnostics.Process]::Start($psi)
          $len = [BitConverter]::GetBytes([int]$msg.Length)
          $hp.StandardInput.BaseStream.Write($len, 0, 4)
          $hp.StandardInput.BaseStream.Write($msg, 0, $msg.Length)
          $hp.StandardInput.BaseStream.Flush()
          $hp.StandardInput.Close()
          $buf = New-Object byte[] 4
          $hp.StandardOutput.BaseStream.Read($buf, 0, 4) | Out-Null
          $n = [BitConverter]::ToInt32($buf, 0)
          $body = New-Object byte[] $n
          $off = 0
          while ($off -lt $n) { $r = $hp.StandardOutput.BaseStream.Read($body, $off, $n - $off); if ($r -le 0) { break }; $off += $r }
          $reply = [System.Text.Encoding]::UTF8.GetString($body)
          Write-Host "host reply: $reply"
          if ($reply -notmatch '"pong"\s*:\s*true') { throw "host handshake failed" }
          $hp.WaitForExit(5000) | Out-Null
          $app = Start-Process (Resolve-Path "$dir/ndm-app.exe").Path -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { Write-Warning "ndm-app.exe exited early, code $($app.ExitCode)" } else { Write-Host "ndm-app.exe alive after 10s"; Stop-Process -Id $app.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-windows-x86
          path: |
            NDM_*_Windows_Portable_x86.zip
      - name: Attach Windows x86 assets to their GitHub release (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $zip = (Get-ChildItem "NDM_${v}_Windows_Portable_x86.zip").Name
          gh release upload "v$v" $zip --clobber --repo $env:GITHUB_REPOSITORY
  windows-setup:
    needs: [windows, windows-i686]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ndm-windows
          path: artifacts/x64
      - uses: actions/download-artifact@v4
        with:
          name: ndm-windows-x86
          path: artifacts/x86
      # One installer for every Windows (the IDM shape): both
      # portable trees go in as x64\ and x86\ payload folders and
      # scripts/installer.nsi (UNIVERSAL mode) installs the one
      # that matches the machine. The portable ZIPs stay separate
      # release assets for anyone who wants them.
      - name: Assemble universal tree
        shell: pwsh
        run: |
          $zip64 = (Get-ChildItem artifacts/x64/NDM_*_Windows_Portable.zip).FullName
          $zip86 = (Get-ChildItem artifacts/x86/NDM_*_Windows_Portable_x86.zip).FullName
          Expand-Archive $zip64 -DestinationPath stage64
          Expand-Archive $zip86 -DestinationPath stage86
          New-Item -ItemType Directory -Force NDM-Universal/x64, NDM-Universal/x86 | Out-Null
          Copy-Item stage64/NDM-Windows-Portable/* NDM-Universal/x64/ -Recurse
          Copy-Item stage86/NDM-Windows-Portable-x86/* NDM-Universal/x86/ -Recurse
      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found" }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $makensis "/DVERSION=$v" "/DSRCROOT=$PWD\NDM-Universal" "/DUNIVERSAL=1" "/DOUTFILE=$PWD\NDM_${v}_setup.exe" "/DICON=$PWD\assets\icon.ico" scripts\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "NDM_${v}_setup.exe")) { throw "installer exe was not produced" }
          Write-Host "universal installer built: NDM_${v}_setup.exe"
      # NSIS setups detach: the launcher process exits while the
      # real installer works in a child process, so -Wait alone can
      # return before a single file is copied. Poll for the full
      # layout instead — that is the actual completion signal.
      - name: Silent-install test — layout + installed app launch
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $setup = (Resolve-Path "NDM_${v}_setup.exe").Path
          $installDir = "$env:LOCALAPPDATA\Programs\Nill Download Manager"
          Start-Process $setup -ArgumentList "/S" -PassThru | Out-Null
          $want = @(
            "ndm-app.exe", "ndm-host.exe", "ucrtbase.dll", "installed.flag", "uninstall.exe",
            "extension\manifest.json", "extension\background.js"
          )
          $deadline = (Get-Date).AddSeconds(180)
          $missing = $want
          while ((Get-Date) -lt $deadline) {
            $missing = $want | Where-Object { -not (Test-Path (Join-Path $installDir $_)) }
            if (-not $missing) { break }
            Start-Sleep -Seconds 2
          }
          if ($missing) { throw "install layout incomplete, missing: $($missing -join ', ')" }
          Write-Host "install layout complete in $installDir"
          # the slim layout must NOT carry a bundled engine: if a
          # components folder ever reappears in the installer, the
          # package is bloated again — fail here, not in the field
          if (Test-Path "$installDir\components") { throw "slim install must not contain a components folder" }
          if ((Get-Content "$installDir\installed.flag" -Raw) -notmatch [regex]::Escape($v)) { throw "installed.flag does not carry version $v" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Nill Download Manager\Nill Download Manager.lnk")) { throw "Start Menu shortcut missing" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Nill Download Manager.lnk")) { throw "desktop shortcut missing" }
          $arp = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Nill Download Manager" -ErrorAction Stop
          if ($arp.DisplayVersion -ne $v) { throw "Add/Remove Programs DisplayVersion is '$($arp.DisplayVersion)', expected '$v'" }
          Write-Host "shortcuts + uninstall entry (v$v) verified"
          $app = Start-Process "$installDir\ndm-app.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "installed ndm-app.exe exited early, code $($app.ExitCode)" }
          Write-Host "installed ndm-app.exe alive after 10s"
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
      # The installed launch above must have made the app register
      # its native-messaging host (its own first-run mechanism):
      # HKCU keys for Chrome + Firefox pointing at manifest files
      # under %APPDATA%\com.ndm.downloadmanager\.
      - name: Extension registration check
        shell: pwsh
        run: |
          $manifestDir = "$env:APPDATA\com.ndm.downloadmanager"
          foreach ($f in @("com.ndm.host.chrome.json", "com.ndm.host.firefox.json")) {
            if (-not (Test-Path (Join-Path $manifestDir $f))) { throw "host manifest missing: $f" }
          }
          foreach ($kv in @(
            @{ Key = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.ndm.host"; Manifest = "com.ndm.host.chrome.json" },
            @{ Key = "HKCU:\Software\Mozilla\NativeMessagingHosts\com.ndm.host"; Manifest = "com.ndm.host.firefox.json" }
          )) {
            if (-not (Test-Path $kv.Key)) { throw "registry key missing: $($kv.Key)" }
            $target = (Get-Item $kv.Key).GetValue("")
            $expected = Join-Path $manifestDir $kv.Manifest
            if ($target -ne $expected) { throw "$($kv.Key) points at '$target', expected '$expected'" }
            Write-Host "registered: $($kv.Key) -> $target"
          }
          Write-Host "extension registration verified (Chrome + Firefox)"
      # No CDP GUI smoke any more: that driver spoke to the old
      # WebView UI. The native shell has no debugging port — its
      # Windows GUI proof is the install + launch-alive gates
      # above and the real-machine run, stated honestly rather
      # than faked here.
      - name: Uninstall (report-only)
        continue-on-error: true
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\Programs\Nill Download Manager"
          Get-Process ndm-app -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path "$installDir\uninstall.exe") {
            Start-Process "$installDir\uninstall.exe" -ArgumentList "/S" -PassThru | Out-Null
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and (Test-Path "$installDir\ndm-app.exe")) { Start-Sleep -Seconds 2 }
            if (Test-Path "$installDir\ndm-app.exe") { Write-Warning "uninstall did not remove the app exe within 60s" }
            else { Write-Host "uninstall removed the installed copy" }
          } else {
            Write-Warning "uninstall.exe not present — nothing to uninstall"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-windows-setup
          path: |
            NDM_*_setup.exe
      - name: Attach the universal installer to its GitHub release (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $setup = (Get-ChildItem "NDM_${v}_setup.exe").Name
          gh release upload "v$v" $setup --clobber --repo $env:GITHUB_REPOSITORY
