# NDM release builds.
#
# Linux:   the .deb (Debian/Ubuntu family) and the portable tarball
#          (any distro) — the same packaging scripts used locally.
# Windows: a portable ZIP (ndm-app.exe + ndm-host.exe + components +
#          extension). A signed .msi installer is a later step; the
#          portable build runs as-is on any Windows 10/11 PC that has
#          the WebView2 runtime (preinstalled on Windows 11 and on
#          updated Windows 10).
#
# Runs on version tags (v*) and on manual dispatch. NOTE: prepared
# ahead of the first push — the first run validates the Windows job.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg zip
      - name: Fetch bundled tools (yt-dlp, deno)
        run: bash scripts/fetch-tools.sh
      - name: Fetch portable ffmpeg (BtbN build — the distro static
          builds segfault on merges, this one is merge-verified)
        run: |
          curl -sL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg tools/ffmpeg
          chmod +x tools/ffmpeg
      - name: Build
        run: |
          cargo build --release
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package (.deb + portable tarball)
        run: |
          bash scripts/package-deb.sh
          bash scripts/package-portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-linux
          path: |
            NDM_*_amd64.deb
            NDM_*_Linux_Portable.tar.xz
            ndm-extension-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch bundled tools (Windows builds)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools/yt-dlp.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile /tmp/deno.zip
          Expand-Archive /tmp/deno.zip -DestinationPath tools -Force
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile /tmp/ff.zip
          Expand-Archive /tmp/ff.zip -DestinationPath /tmp/ff -Force
          Copy-Item /tmp/ff/*/bin/ffmpeg.exe tools/ffmpeg.exe
      - name: Build
        run: |
          cargo build --release
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "NDM-Windows-Portable"
          New-Item -ItemType Directory -Force $dir/components | Out-Null
          Copy-Item src-tauri/target/release/ndm-app.exe $dir/
          Copy-Item target/release/ndm-host.exe $dir/
          Copy-Item tools/yt-dlp.exe, tools/deno.exe, tools/ffmpeg.exe $dir/components/
          Copy-Item extension $dir/extension -Recurse
          Compress-Archive $dir "NDM_${v}_Windows_Portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-windows
          path: NDM_*_Windows_Portable.zip
